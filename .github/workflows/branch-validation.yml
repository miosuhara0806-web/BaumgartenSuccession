name: Branch validation

on:
  push:
    branches:
      - codex/prologue-companion-reunion-20261031

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test
      - run: node scripts/check.js
      - run: node scripts/build.js
